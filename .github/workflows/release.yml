name: Semantic Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  # Validate the full platform matrix compiles before allowing semantic-release
  # to publish. A broken Windows / macOS / Linux build now blocks the release
  # tag from ever being created, so we never end up with a "released" version
  # that has no working binaries (see the v1.18.0 incident where the missing
  # config.w32 entry produced a release without a Windows .dll).
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release 2>&1 | tee sr-output.txt
          if grep -q "Published release" sr-output.txt; then
            VERSION=$(grep "next release version" sr-output.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      # The pre-release build only validated compilation. After the tag
      # exists, re-run build.yml against that tag so its release job
      # (gated on refs/tags/*) uploads the actual platform binaries to
      # the freshly-created GitHub release.
      - name: Trigger build workflow
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref "v${{ steps.semantic.outputs.new_release_version }}"
