  # ── macOS x86_64 ──────────────────────────────────────────────────
  macos-x86_64:
    runs-on: macos-15
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          # The runner image ships stale Homebrew metadata and does not auto-update,
          # so it installed spirv-cross 1.4.357.0 although the formula is on
          # 1.4.363.0 (the first with the MSL struct-array stride fix test 094 needs).
          brew update --quiet
          brew install glfw glslang spirv-cross vulkan-loader vulkan-headers ffmpeg harfbuzz pkg-config
          v=$(brew list --versions spirv-cross | awk '{print $2}')
          echo "spirv-cross $v"
          if [ "$(printf '%s\n' 1.4.363.0 "$v" | sort -V | head -n1)" != "1.4.363.0" ]; then
            echo "::error::spirv-cross $v is older than 1.4.363.0 (MSL struct-array stride fix, test 094)"
            exit 1
          fi

      - name: Build extension
        run: |
          phpize
          ./configure \
            --enable-vio \
            --with-glfw \
            --with-glslang \
            --with-spirv-cross \
            --with-vulkan \
            --with-ffmpeg \
            --with-metal \
            --with-harfbuzz
          make -j$(sysctl -n hw.ncpu)

      - name: Smoke test — extension loads (eager symbol binding)
        run: |
          DYLD_BIND_AT_LAUNCH=1 php -n -d extension_dir="$PWD/modules" -d extension=vio.so \
            -r 'exit((int) !extension_loaded("vio"));'

      - name: Run tests
        run: |
          # -n ignores the runner's system php.ini (which enables dozens of
          # bundled extensions by short name); without it, redirecting
          # extension_dir to modules/ floods every test with "Unable to load"
          # warnings that break the --EXPECT-- match. TEST_PHP_ARGS is applied
          # to each test's child process, so vio loads + ini stays clean.
          export NO_INTERACTION=1 REPORT_EXIT_STATUS=1
          export TEST_PHP_ARGS="-n -d extension_dir=$PWD/modules -d extension=vio.so"
          php -n run-tests.php -q --show-diff tests/

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          BASENAME="php_vio-${VERSION}_php${{ matrix.php }}-x86_64-darwin-bsdlibc"
          strip -x modules/vio.so
          cp modules/vio.so "${BASENAME}.so"
          # PIE expects the extension name (vio.so) inside the zip
          cp modules/vio.so vio.so
          zip "${BASENAME}.zip" vio.so

      - uses: actions/upload-artifact@v4
        with:
          name: vio-macos-x86_64-php${{ matrix.php }}
          path: php_vio-*_php${{ matrix.php }}-x86_64-darwin-bsdlibc.zip

