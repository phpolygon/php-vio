name: Build Binaries

on:
  push:
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Allow release.yml to gate the semantic-release publish step on the
  # full platform matrix compiling cleanly. The release job inside this
  # workflow is gated on refs/tags/* so workflow_call invocations only
  # validate compilation - the upload happens on the post-tag invocation.
  workflow_call:

permissions:
  contents: write

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────
  linux-x86_64:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft Edge, …) whose mirrors intermittently answer with
          # "Hash Sum mismatch" and take the whole job down. We only need
          # Ubuntu's own archive, so drop them (matched by content — the image
          # uses deb822 *.sources files, not *.list) and retry once.
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update || (sleep 15 && sudo apt-get update)
          sudo apt-get install -y \
            libglfw3-dev \
            glslang-dev \
            libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            spirv-cross libspirv-cross-c-shared-dev \
            libharfbuzz-dev \
            xvfb libgl1-mesa-dri libglx-mesa0 \
            mesa-vulkan-drivers vulkan-tools \
            pkg-config

      - name: Build extension
        run: |
          phpize
          ./configure \
            --enable-vio \
            --with-glfw \
            --with-glslang \
            --with-spirv-cross \
            --with-vulkan \
            --with-ffmpeg \
            --with-harfbuzz
          make -j$(nproc)

      # Loading the freshly built module with eager symbol binding is the
      # gate that catches a "compiles but won't link/load" extension — e.g.
      # a new src/*.c missing from config.m4, whose symbols stay undefined
      # in the shared .so (tolerated at link, fatal at static link / load).
      - name: Smoke test — extension loads (eager symbol binding)
        run: |
          LD_BIND_NOW=1 php -n -d extension_dir="$PWD/modules" -d extension=vio.so \
            -r 'exit((int) !extension_loaded("vio"));'

      - name: Run tests (Xvfb + Mesa software GL)
        run: |
          # vio's MINIT calls glfwInit(), which needs a display; the GPU tests
          # need an OpenGL >= 3.3 context. Provide both headlessly via Xvfb +
          # Mesa/llvmpipe (LIBGL_ALWAYS_SOFTWARE=1). -n keeps the child ini
          # clean — the runner's system php.ini enables many extensions by
          # short name, which would otherwise flood every test with "Unable to
          # load" warnings and break the --EXPECT-- match.
          export NO_INTERACTION=1 REPORT_EXIT_STATUS=1 LIBGL_ALWAYS_SOFTWARE=1
          export TEST_PHP_ARGS="-n -d extension_dir=$PWD/modules -d extension=vio.so"
          # mesa-vulkan-drivers (lavapipe) is installed for the step below; hide
          # it here so the suite keeps running on OpenGL (auto would pick Vulkan).
          export VK_DRIVER_FILES=/nonexistent/vio-no-vulkan.json
          # No sound card on CI runners -> ALSA spews "cannot find card" errors
          # that pollute audio-test output. Route the default device to null so
          # miniaudio opens it silently.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"
          xvfb-run -a php -n run-tests.php -q --show-diff tests/

      - name: Run required-feature tests (lavapipe Vulkan)
        run: |
          # Feature tests skip where a flag is 0, so a green suite cannot tell a
          # real run from a skip. Here Vulkan (lavapipe) is mandatory. OpenGL is
          # not: llvmpipe has no GL_KHR_shader_subgroup (Mesa / LLVM 20 on
          # ubuntu-24.04) and zink gets no context under Xvfb (no DRI3, also
          # with LIBGL_KOPPER_DRI2) - measured on this runner. The GL line below
          # records what llvmpipe reports.
          export NO_INTERACTION=1 REPORT_EXIT_STATUS=1 LIBGL_ALWAYS_SOFTWARE=1
          export TEST_PHP_ARGS="-n -d extension_dir=$PWD/modules -d extension=vio.so"
          VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          if [ -z "$VK_DRIVER_FILES" ]; then echo "lavapipe ICD not found"; exit 1; fi
          export VK_DRIVER_FILES
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"
          xvfb-run -a php -n -d extension_dir=$PWD/modules -d extension=vio.so -r '
            $c = vio_create("opengl", ["width" => 8, "height" => 8, "headless" => true]);
            if (!$c) { echo "GL: no context\n"; exit(0); }
            $i = vio_gl_info($c);
            printf("GL %s (%s) compute=%d KHR_shader_subgroup=%d stages=0x%x features=0x%x size=%d\n",
              $i["version"], $i["renderer"], $i["features"]["compute_shader"],
              in_array("GL_KHR_shader_subgroup", $i["extensions"], true),
              $i["subgroup_stages"], $i["subgroup_features"], $i["subgroup_size"]);
            printf("GL float16=%d draw_parameters=%d compute_derivatives=%d atomic64=%d barycentrics=%d multiview=%d\n",
              $i["features"]["float16"], $i["features"]["draw_parameters"], $i["features"]["compute_derivatives"],
              $i["features"]["atomic64"], $i["features"]["barycentrics"], $i["features"]["multiview"]);'
          # What lavapipe offers for the feature tests below.
          vulkaninfo 2>/dev/null | grep -E "VK_EXT_mesh_shader|meshShader|taskShader|rayQuery|accelerationStructure\b|VK_KHR_ray_query|VK_KHR_acceleration_structure|runtimeDescriptorArray|shaderSampledImageArrayNonUniformIndexing|descriptorBindingPartiallyBound|descriptorBindingSampledImageUpdateAfterBind|VK_EXT_descriptor_indexing|FragmentShadingRate|fragment_shading_rate|NonTrivialCombinerOps|multiview|deviceName|apiVersion|VK_KHR_fragment_shader_barycentric|fragmentShaderBarycentric|shaderInt64|shaderBufferInt64Atomics|shaderFloat16|shaderDrawParameters|drawIndirectFirstInstance|compute_shader_derivatives|computeDerivativeGroupQuads" | sort -u || true
          # Barycentrics stay optional here: lavapipe (Mesa, Vulkan 1.4.318) has no
          # VK_KHR_fragment_shader_barycentric. They are mandatory on WARP instead.
          export VIO_REQUIRE_SUBGROUP=vulkan VIO_REQUIRE_SUBGROUP_QUAD=vulkan VIO_REQUIRE_ATOMIC64=vulkan
          export VIO_REQUIRE_SHADER_FLOAT16=vulkan VIO_REQUIRE_BASE_VERTEX=vulkan,opengl
          # lavapipe has VK_KHR_compute_shader_derivatives (measured).
          export VIO_REQUIRE_COMPUTE_DERIVATIVES=vulkan
          export VIO_REQUIRE_MULTIVIEW=vulkan,opengl
          # Bindless table (descriptor indexing, lavapipe).
          export VIO_REQUIRE_BINDLESS=vulkan
          xvfb-run -a php -n run-tests.php -q --show-diff \
            tests/render3d/149_subgroup_ops_all_backends.phpt \
            tests/render3d/152_subgroup_quad_all_backends.phpt \
            tests/render3d/153_barycentrics_all_backends.phpt \
            tests/render3d/154_atomic64_all_backends.phpt \
            tests/render3d/155_shader_float16_all_backends.phpt \
            tests/render3d/156_base_vertex_instance_all_backends.phpt \
            tests/render3d/157_compute_derivatives_all_backends.phpt \
            tests/render3d/158_multiview_all_backends.phpt \
            tests/render3d/159_primitive_shading_rate_all_backends.phpt \
            tests/render3d/160_shading_rate_image_all_backends.phpt \
            tests/render3d/161_bindless_all_backends.phpt \
            tests/render3d/163_ray_query_all_backends.phpt \
            tests/render3d/162_mesh_shaders_all_backends.phpt \
            tests/render3d/166_work_graphs_d3d12.phpt

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          BASENAME="php_vio-${VERSION}_php${{ matrix.php }}-x86_64-linux-glibc"
          strip modules/vio.so
          cp modules/vio.so "${BASENAME}.so"
          # PIE expects the extension name (vio.so) inside the zip
          cp modules/vio.so vio.so
          zip "${BASENAME}.zip" vio.so

      - uses: actions/upload-artifact@v4
        with:
          name: vio-linux-x86_64-php${{ matrix.php }}
          path: php_vio-*_php${{ matrix.php }}-x86_64-linux-glibc.zip

