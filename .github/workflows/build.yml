          strip -x modules/vio.so
          cp modules/vio.so "${BASENAME}.so"
          # PIE expects the extension name (vio.so) inside the zip
          cp modules/vio.so vio.so
          zip "${BASENAME}.zip" vio.so

      - uses: actions/upload-artifact@v4
