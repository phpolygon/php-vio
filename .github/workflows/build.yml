name: Build Binaries

on:
  push:
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Allow release.yml to gate the semantic-release publish step on the
  # full platform matrix compiling cleanly. The release job inside this
  # workflow is gated on refs/tags/* so workflow_call invocations only
  # validate compilation - the upload happens on the post-tag invocation.
  workflow_call:

permissions:
  contents: write

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────
  linux-x86_64:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            glslang-dev \
            libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            spirv-cross libspirv-cross-c-shared-dev \
            pkg-config

      - name: Build extension
        run: |
          phpize
          ./configure \
            --enable-vio \
            --with-glfw \
            --with-glslang \
            --with-spirv-cross \
            --with-vulkan \
            --with-ffmpeg
          make -j$(nproc)

      # Loading the freshly built module with eager symbol binding is the
      # gate that catches a "compiles but won't link/load" extension — e.g.
      # a new src/*.c missing from config.m4, whose symbols stay undefined
      # in the shared .so (tolerated at link, fatal at static link / load).
      - name: Smoke test — extension loads (eager symbol binding)
        run: |
          LD_BIND_NOW=1 php -d extension_dir="$PWD/modules" -d extension=vio.so \
            -r 'exit((int) !extension_loaded("vio"));'

      - name: Run tests
        run: |
          NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test TESTS=tests/

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          BASENAME="php_vio-${VERSION}_php${{ matrix.php }}-x86_64-linux-glibc"
          strip modules/vio.so
          cp modules/vio.so "${BASENAME}.so"
          # PIE expects the extension name (vio.so) inside the zip
          cp modules/vio.so vio.so
          zip "${BASENAME}.zip" vio.so

      - uses: actions/upload-artifact@v4
        with:
          name: vio-linux-x86_64-php${{ matrix.php }}
          path: php_vio-*_php${{ matrix.php }}-x86_64-linux-glibc.zip

  # ── Linux aarch64 ─────────────────────────────────────────────────
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            glslang-dev \
            libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            spirv-cross libspirv-cross-c-shared-dev \
            pkg-config

      - name: Build extension
        run: |
          phpize
          ./configure \
            --enable-vio \
            --with-glfw \
            --with-glslang \
            --with-spirv-cross \
            --with-vulkan \
            --with-ffmpeg
          make -j$(nproc)

      - name: Smoke test — extension loads (eager symbol binding)
        run: |
          LD_BIND_NOW=1 php -d extension_dir="$PWD/modules" -d extension=vio.so \
            -r 'exit((int) !extension_loaded("vio"));'

      - name: Run tests
        run: |
          NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test TESTS=tests/

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          BASENAME="php_vio-${VERSION}_php${{ matrix.php }}-arm64-linux-glibc"
          strip modules/vio.so
          cp modules/vio.so "${BASENAME}.so"
          # PIE expects the extension name (vio.so) inside the zip
          cp modules/vio.so vio.so
          zip "${BASENAME}.zip" vio.so

      - uses: actions/upload-artifact@v4
        with:
          name: vio-linux-aarch64-php${{ matrix.php }}
          path: php_vio-*_php${{ matrix.php }}-arm64-linux-glibc.zip

  # ── macOS x86_64 ──────────────────────────────────────────────────
  macos-x86_64:
    runs-on: macos-15
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          brew install glfw glslang spirv-cross vulkan-loader vulkan-headers ffmpeg pkg-config

      - name: Build extension
        run: |
          phpize
          ./configure \
            --enable-vio \
            --with-glfw \
            --with-glslang \
            --with-spirv-cross \
            --with-vulkan \
            --with-ffmpeg \
            --with-metal
          make -j$(sysctl -n hw.ncpu)

      - name: Smoke test — extension loads (eager symbol binding)
        run: |
          DYLD_BIND_AT_LAUNCH=1 php -d extension_dir="$PWD/modules" -d extension=vio.so \
            -r 'exit((int) !extension_loaded("vio"));'

      - name: Run tests
        run: |
          NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test TESTS=tests/

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          BASENAME="php_vio-${VERSION}_php${{ matrix.php }}-x86_64-darwin-bsdlibc"
          strip -x modules/vio.so
          cp modules/vio.so "${BASENAME}.so"
          # PIE expects the extension name (vio.so) inside the zip
          cp modules/vio.so vio.so
          zip "${BASENAME}.zip" vio.so

      - uses: actions/upload-artifact@v4
        with:
          name: vio-macos-x86_64-php${{ matrix.php }}
          path: php_vio-*_php${{ matrix.php }}-x86_64-darwin-bsdlibc.zip

  # ── macOS arm64 ───────────────────────────────────────────────────
  macos-arm64:
    runs-on: macos-15
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          brew install glfw glslang spirv-cross vulkan-loader vulkan-headers ffmpeg pkg-config

      - name: Build extension
        run: |
          phpize
          ./configure \
            --enable-vio \
            --with-glfw \
            --with-glslang \
            --with-spirv-cross \
            --with-vulkan \
            --with-ffmpeg \
            --with-metal
          make -j$(sysctl -n hw.ncpu)

      - name: Smoke test — extension loads (eager symbol binding)
        run: |
          DYLD_BIND_AT_LAUNCH=1 php -d extension_dir="$PWD/modules" -d extension=vio.so \
            -r 'exit((int) !extension_loaded("vio"));'

      - name: Run tests
        run: |
          NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test TESTS=tests/

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          BASENAME="php_vio-${VERSION}_php${{ matrix.php }}-arm64-darwin-bsdlibc"
          strip -x modules/vio.so
          cp modules/vio.so "${BASENAME}.so"
          # PIE expects the extension name (vio.so) inside the zip
          cp modules/vio.so vio.so
          zip "${BASENAME}.zip" vio.so

      - uses: actions/upload-artifact@v4
        with:
          name: vio-macos-arm64-php${{ matrix.php }}
          path: php_vio-*_php${{ matrix.php }}-arm64-darwin-bsdlibc.zip

  # ── Windows x64 ──────────────────────────────────────────────────
  windows-x64:
    runs-on: windows-2022
    strategy:
      matrix:
        php: ['8.5']
        ts: ['nts', 'ts']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Setup PHP SDK
        id: php-sdk
        uses: php/setup-php-sdk@v0.12
        with:
          version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}

      - name: Download GLFW
        shell: cmd
        run: |
          mkdir deps
          curl -sSL -o deps\glfw.zip https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip
          7z x deps\glfw.zip -odeps\glfw-extract
          xcopy /E /I deps\glfw-extract\glfw-3.4.bin.WIN64\include deps\include
          xcopy /E /I deps\glfw-extract\glfw-3.4.bin.WIN64\lib-vc2022 deps\lib

      # Vulkan SDK (LunarG) bundles vulkan-1.lib, glslang.lib + SPIRV-Tools*.lib +
      # spirv-cross-c.lib and matching headers. One install, four --with-* covered.
      - name: Setup Vulkan SDK (vulkan + glslang + SPIRV-Cross + SPIRV-Tools)
        uses: humbletim/setup-vulkan-sdk@v1.2.1  # v1.2.0 bundles actions/cache@v2 (deprecated)
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Cross, SPIRV-Tools, SPIRV-Reflect
          vulkan-use-cache: true

      - name: Merge Vulkan SDK into deps/
        shell: pwsh
        run: |
          # VULKAN_SDK is set by humbletim/setup-vulkan-sdk
          if (-not $env:VULKAN_SDK) { throw "VULKAN_SDK not set" }
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          # SDK uses Include/Lib (case-insensitive on Windows; copy preserving case-folding)
          Copy-Item -Recurse -Force "$env:VULKAN_SDK\Include\*" deps\include\
          Copy-Item -Recurse -Force "$env:VULKAN_SDK\Lib\*"     deps\lib\

      - name: Download FFmpeg (BtbN prebuilt, GPL-shared)
        shell: pwsh
        run: |
          $url  = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          $zip  = "deps\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath deps\ffmpeg-extract -Force
          $root = (Get-ChildItem deps\ffmpeg-extract -Directory | Select-Object -First 1).FullName
          Copy-Item -Recurse -Force "$root\include\*" deps\include\
          Copy-Item -Recurse -Force "$root\lib\*"     deps\lib\
          New-Item -ItemType Directory -Force -Path deps\bin | Out-Null
          Copy-Item -Force "$root\bin\*.dll"          deps\bin\

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Build extension (full — vulkan + glslang + spirv-cross + ffmpeg + d3d11/12)"
        shell: cmd
        run: |
          call phpize.bat
          call configure ^
            --enable-vio ^
            --with-glfw=deps ^
            --with-vulkan=deps ^
            --with-glslang=deps ^
            --with-spirv-cross=deps ^
            --with-ffmpeg=deps ^
            --with-d3d11=yes ^
            --with-d3d12=yes ^
            --with-prefix=${{ steps.php-sdk.outputs.prefix }}
          nmake

      - name: Package binary
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME -replace '/','-' } else { "dev" }
          $dllPath = Get-ChildItem -Recurse -Filter "php_vio.dll" | Select-Object -First 1
          if (-not $dllPath) { $dllPath = Get-ChildItem -Recurse -Filter "vio.dll" | Select-Object -First 1 }
          # PIE expects DLL name inside ZIP to match asset name (with .dll extension)
          $baseName = "php_vio-${version}-${{ matrix.php }}-${{ matrix.ts }}-vs17-x86_64"
          $renamedDll = "$($dllPath.Directory)\${baseName}.dll"
          Copy-Item $dllPath.FullName $renamedDll
          Compress-Archive -Path $renamedDll -DestinationPath "${baseName}.zip"
          # Also keep bare DLL for direct download (PIE can't unzip on Windows)
          Copy-Item $renamedDll "${baseName}.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: vio-windows-x64-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            php_vio-*-${{ matrix.php }}-${{ matrix.ts }}-vs17-x86_64.zip
            php_vio-*-${{ matrix.php }}-${{ matrix.ts }}-vs17-x86_64.dll

  # ── Release ───────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

      # Tell hmennen90/static-php-cli to rebuild micro.sfx so the bundled
      # PHP picks up this php-vio release. Requires a fine-grained PAT
      # stored as repo secret STATIC_PHP_CLI_DISPATCH_PAT with permission
      # `actions: write` on hmennen90/static-php-cli. Without the secret
      # this step warns and exits 0 — the release itself still succeeds.
      - name: Trigger static-php-cli rebuild
        env:
          GH_TOKEN: ${{ secrets.STATIC_PHP_CLI_DISPATCH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::STATIC_PHP_CLI_DISPATCH_PAT not configured — skipping downstream rebuild trigger"
            exit 0
          fi
          gh api -X POST /repos/hmennen90/static-php-cli/dispatches \
            -f event_type=php-vio-released \
            -F "client_payload[version]=${GITHUB_REF_NAME}" \
            -F "client_payload[source_run]=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
